name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 与发布目标平台一致，避免路径分隔符 / 子进程行为差异造成误报
    runs-on: windows-latest
    env:
      # 英文 Windows 镜像控制台为 cp1252，测试输出的 ▶/✓/中文会
      # UnicodeEncodeError（run_all.py 内也做了同样兜底，双保险）
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 ffmpeg（test_unlock 需要）
        shell: pwsh
        run: choco install -y ffmpeg

      - name: 运行测试套件
        shell: pwsh
        run: python tests/run_all.py
