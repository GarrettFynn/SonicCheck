name: build

# v2.0：tag 推送触发自动打包，产物挂到 GitHub **草稿** Release
# （不可变 release 纪律：只建草稿，发布动作永远留给人工）
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 下载 ffmpeg（full 仅取 ffmpeg.exe；ffprobe 用 essentials 8.1 存档，与本地/发布决策一致）
        shell: pwsh
        run: |
          # v1.4.0 决策：chromaprint 在 ffmpeg 里，ffprobe 无指纹功能用
          # essentials——CI 必须与本地打包同构，否则体积 +127MB。
          # 8.1 essentials 用 GyanD/codexffmpeg GitHub release 存档
          # （gyan.dev 主站只保留最新 essentials，老版本 URL 会 404）
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build.7z' -OutFile ffmpeg.7z
          if ((Get-Item ffmpeg.7z).Length -lt 150MB) {
            throw "ffmpeg full 包体积异常，疑似下载不完整"
          }
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-essentials_build.zip' -OutFile ffmpeg_ess.zip
          if ((Get-Item ffmpeg_ess.zip).Length -lt 20MB) {
            throw "ffmpeg essentials 包体积异常"
          }
          7z x ffmpeg.7z -offx | Out-Null
          7z x ffmpeg_ess.zip -ofess | Out-Null
          New-Item -ItemType Directory -Force resources/ffmpeg | Out-Null
          Copy-Item ffx/ffmpeg-9.0.2-full_build/bin/ffmpeg.exe resources/ffmpeg/
          Copy-Item fess/ffmpeg-8.1-essentials_build/bin/ffprobe.exe resources/ffmpeg/
          & resources/ffmpeg/ffmpeg.exe -version | Select-Object -First 1
          & resources/ffmpeg/ffprobe.exe -version | Select-Object -First 1

      - name: 全量测试
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py

      - name: PyInstaller 打包
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name SonicCheck --icon resources/icon.ico
          --add-data "resources;resources" --exclude-module tests main.py

      - name: 提取版本号（从源码读，tag 推送与 dispatch 通用）
        id: ver
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $m = (Select-String -Path main_window.py -Pattern 'APP_VERSION = "(.+?)"').Matches[0]
          "version=$($m.Groups[1].Value)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: 压缩 zip（CI 产物统一 _CI 后缀，进 CI 专属草稿）
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path 'dist\SonicCheck\*' `
            -DestinationPath "SonicCheck_v${v}_win64_CI.zip" -Force

      - name: 挂到 CI 专属草稿（独立命名，不与正式发布冲突）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          # CI 产物独立标识：tag_label={tag}-ci（草稿期只是标签，发布才绑 tag）、
          # 资产名加 _CI 后缀——正式发布的 release 是不可变的，绝不能碰
          $tagLabel = "${tag}-ci"
          $assetName = "SonicCheck_v${v}_win64_CI.zip"
          $draft = gh api "repos/${{ github.repository }}/releases?per_page=20" |
            ConvertFrom-Json | Where-Object { $_.draft -and $_.tag_name -eq $tagLabel } |
            Select-Object -First 1
          if (-not $draft) {
            $url = gh release create $tagLabel --draft --title "CI build $tag" `
              --notes "CI 自动构建（双轨对照用），勿直接发布；正式包见人工发布条目"
            $draftId = ($url -split '/')[-1]
          } else {
            $draftId = $draft.id
          }
          gh release upload $tagLabel "$assetName" --clobber
          Write-Host "CI 草稿已就绪: release id=$draftId asset=$assetName"
