name: build

# v2.0：tag 推送触发自动打包，产物挂到 GitHub **草稿** Release
# （不可变 release 纪律：只建草稿，发布动作永远留给人工）
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 下载 ffmpeg full（钉版本 + 体积校验）
        shell: pwsh
        run: |
          $url = 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build.7z'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.7z
          $min = 150MB   # 完整包体积下限（版本漂移/截断下载防线；gyan 未发布固定 sha256）
          if ((Get-Item ffmpeg.7z).Length -lt $min) {
            throw "ffmpeg 包体积异常，疑似下载不完整"
          }
          # 7z 解包（runner 自带）
          7z x ffmpeg.7z -offx | Out-Null
          New-Item -ItemType Directory -Force resources\ffmpeg | Out-Null
          Copy-Item ffx\ffmpeg-9.0.2-full_build\bin\ffmpeg.exe resources\ffmpeg\
          Copy-Item ffx\ffmpeg-9.0.2-full_build\bin\ffprobe.exe resources\ffmpeg\
          & resources\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: 全量测试
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py

      - name: PyInstaller 打包
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name SonicCheck --icon resources/icon.ico
          --add-data "resources;resources" --exclude-module tests main.py

      - name: 提取版本号（从源码读，tag 推送与 dispatch 通用）
        id: ver
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ver = python -c "import re; print(re.search(r'APP_VERSION = \"([^\"]+)\"', open('main_window.py', encoding='utf-8').read()).group(1))"
          "version=$ver" | Out-File -Append $env:GITHUB_OUTPUT

      - name: 压缩 zip
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path 'dist\SonicCheck\*' `
            -DestinationPath "SonicCheck_v${v}_win64.zip" -Force

      - name: 挂到 CI 专属草稿（独立命名，不与正式发布冲突）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = '${{ github.ref_name }}'
          # CI 产物独立标识：tag_label={tag}-ci（草稿期只是标签，发布才绑 tag）、
          # 资产名加 _CI 后缀——正式发布的 release 是不可变的，绝不能碰
          $tagLabel = "${tag}-ci"
          $assetName = "SonicCheck_v${v}_win64_CI.zip"
          $draft = gh api "repos/${{ github.repository }}/releases?per_page=20" |
            ConvertFrom-Json | Where-Object { $_.draft -and $_.tag_name -eq $tagLabel } |
            Select-Object -First 1
          if (-not $draft) {
            $url = gh release create $tagLabel --draft --title "CI build $tag" `
              --notes "CI 自动构建（双轨对照用），勿直接发布；正式包见人工发布条目"
            $draftId = ($url -split '/')[-1]
          } else {
            $draftId = $draft.id
          }
          gh release upload $tagLabel "$assetName" --clobber
          Write-Host "CI 草稿已就绪: release id=$draftId asset=$assetName"
